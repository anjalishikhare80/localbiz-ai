{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h3 class="m-0">Notifications</h3>
  <div class="d-flex gap-2">
    <form method="post" action="{% url 'notifications:refresh' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-primary">Check for new alerts</button></form>
    <form method="post" action="{% url 'notifications:mark_read' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Mark all read</button></form></div></div>
<div class="list-group">
{% for n in object_list %}
  <div class="list-group-item {% if not n.is_read %}list-group-item-{{ n.level }}{% endif %}">
    <div class="d-flex justify-content-between"><b>{{ n.title }}</b><small class="text-muted">{{ n.created_at|date:"d M Y H:i" }}</small></div>
    <div class="small">{{ n.message }}</div></div>
{% empty %}<div class="list-group-item text-muted">No notifications.</div>{% endfor %}
</div>
{% endblock %}
