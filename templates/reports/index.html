{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<h3 class="mb-3">Reports</h3>
<div class="row g-3">{% for slug, title in reports %}
  <div class="col-md-4 col-lg-3"><a class="card p-3 text-decoration-none" href="{% url 'reports:report' slug %}"><b>{{ title }}</b><span class="small text-muted">View · export CSV</span></a></div>
{% endfor %}</div>
{% endblock %}
