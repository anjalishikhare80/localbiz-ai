{% extends "base.html" %}
{% load static %}
{% block title %}New sale{% endblock %}
{% block content %}
<h3 class="mb-3">New sale</h3>
{% csrf_token %}
<div id="cart-app" data-mode="sale" data-search-url="{% url 'catalog:product_search' %}" data-submit-url="{% url 'sales:new' %}"
     data-recommend-url="{% url 'ml:recommend' 0 %}" data-tax-rate="{{ tax_rate }}" class="row g-3">
  <div class="col-lg-8">
    <div class="card p-3">
      <input id="product-search" class="form-control" placeholder="Search product by name, SKU or scan barcode…" autocomplete="off" autofocus>
      <div id="search-results" class="list-group mt-1"></div>
      <div id="recommend-hint" class="small mt-2"></div>
      <div class="table-responsive mt-3"><table class="table table-sm align-middle">
        <thead><tr><th>Product</th><th>Stock</th><th>Qty</th><th class="text-end">Price</th><th>Discount</th><th class="text-end">Amount</th><th></th></tr></thead>
        <tbody id="cart-body"></tbody></table></div>
    </div>
  </div>
  <div class="col-lg-4">
    <div class="card p-3">
      <div class="mb-2"><label class="form-label">Customer <span class="text-muted small">(required for credit / part payment)</span></label>
        <select id="customer" class="form-select"><option value="">Walk-in customer</option>{% for c in customers %}<option value="{{ c.pk }}">{{ c.name }}{% if c.phone %} · {{ c.phone }}{% endif %}</option>{% endfor %}</select></div>
      <div class="mb-2"><label class="form-label">Payment method</label>
        <select id="payment-method" class="form-select">{% for v, l in methods %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
      <div class="mb-2"><label class="form-label">Amount paid <span class="text-muted small">(blank = paid in full)</span></label>
        <input id="amount-paid" type="number" step="0.01" min="0" class="form-control" placeholder="Full amount"></div>
      <div class="mb-3"><label class="form-label">Note</label><input id="note" class="form-control" maxlength="255"></div>
      <table class="table table-sm mb-3"><tr><td>Subtotal</td><td id="t-subtotal" class="text-end">0.00</td></tr>
        <tr><td>Tax ({{ tax_rate }}%)</td><td id="t-tax" class="text-end">0.00</td></tr>
        <tr class="fw-bold fs-5"><td>Total</td><td id="t-total" class="text-end">0.00</td></tr></table>
      <div id="cart-error" class="alert alert-danger d-none py-2"></div>
      <button id="submit-cart" class="btn btn-primary w-100">Complete sale</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{% static 'js/cart.js' %}"></script>{% endblock %}
