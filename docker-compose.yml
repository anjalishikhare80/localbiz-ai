# Local production-like stack:  docker compose --env-file .env.docker up --build
#   db      PostgreSQL 16
#   redis   Celery broker
#   web     Django + gunicorn  (runs migrations on start)
#   worker  Celery worker      (background jobs)
#   beat    Celery beat        (hourly alerts, weekly model retraining)
#
# First copy .env.docker.example to .env.docker and fill it in.
x-app: &app
  build: .
  env_file: .env.docker
  environment: &app-env
    DB_HOST: db
    DB_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - media:/app/media
    - ml_artifacts:/app/ml_artifacts

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-localbiz_db}
      POSTGRES_USER: ${DB_USER:-localbiz_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-localbiz_user} -d ${DB_NAME:-localbiz_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  web:
    <<: *app
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A config worker -l info

  beat:
    <<: *app
    command: celery -A config beat -l info

volumes:
  pgdata:
  media:
  ml_artifacts:
