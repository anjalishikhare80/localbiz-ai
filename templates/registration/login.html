{% extends "base.html" %}
{% block title %}Sign in - LocalBiz AI{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5"><div class="col-md-5 col-lg-4">
  <div class="card p-4">
    <h3 class="mb-1">LocalBiz <span class="text-info">AI</span></h3>
    <p class="text-muted">Sign in to your business</p>
    <form method="post">{% csrf_token %}
      {{ form.non_field_errors }}
      <div class="mb-3"><label class="form-label">Username</label>{{ form.username }}</div>
      <div class="mb-3"><label class="form-label">Password</label>{{ form.password }}</div>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-primary w-100">Sign in</button>
    </form>
    <hr><a href="{% url 'accounts:register' %}">Register a new business</a>
  </div>
</div></div>
{% endblock %}
